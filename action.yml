# Makes this repo a reusable GitHub Action, publishable on its own.
# A client's workflow references it via `uses: <your-org>/<this-repo>@v1`
# — GitHub fetches this repo at run time and runs the steps below, with the
# CLIENT's repo already checked out as the working directory.
#
# The agent that edits code runs HERE, on the client's runner, driven by the
# client's own API key. Nothing in this action sends code anywhere.
name: "API Change Auto-Fix"
description: "Runs the caller's own coding agent (Codex or Claude Code) to migrate their repo when a vendor API changes."

inputs:
  trigger-payload:
    description: "JSON response from polling Zenik's change-feed API, passed through unmodified by the caller's workflow."
    required: true

  openai-api-key:
    description: >
      The caller's OpenAI API key. Selects the Codex backend. Passed as an
      input rather than a job-level env var so it is not readable by other
      steps or by repository-controlled code in the same job.
    required: false
    default: ""

  anthropic-api-key:
    description: >
      The caller's Anthropic API key. Selects the Claude Code backend.
      If both keys are provided, use `agent-backend` to choose.
    required: false
    default: ""

  agent-backend:
    description: "Which agent to use: 'codex' or 'claude-code'. Defaults to whichever key is set (codex if both)."
    required: false
    default: ""

  agent-model:
    description: "Optional model override passed through to the agent CLI."
    required: false
    default: ""

  agent-timeout-seconds:
    description: "Wall-clock limit for the agent run."
    required: false
    default: "900"

  zenik-api-url:
    description: "Base URL of the change-feed API. Used only to report an anonymous run record; see telemetry.py."
    required: false
    default: ""

  zenik-client-key:
    description: "The caller's Zenik client key, used to attribute the run record."
    required: false
    default: ""

outputs:
  files-changed:
    description: "Number of files the agent modified. 0 means no PR is needed."
    value: ${{ steps.fix.outputs.files-changed }}
  outcome:
    description: "One of: fixed, no_usages_found, agent_failed, fallback_deterministic."
    value: ${{ steps.fix.outputs.outcome }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # Agent CLIs are distributed via npm; Python drives them.
    - uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install dependencies
      shell: bash
      run: pip install -r ${{ github.action_path }}/requirements.txt

    # Codex's Linux sandbox uses bubblewrap, which needs to create an
    # unprivileged user namespace. On Ubuntu 24.04 — which is what
    # ubuntu-latest runners are — AppArmor blocks that unless the
    # bwrap-userns-restrict profile is loaded, and bwrap then fails every
    # command with "Failed RTM_NEWADDR: Operation not permitted".
    #
    # This is the fix OpenAI documents for Ubuntu 24.04 rather than a
    # workaround: install bubblewrap and load the AppArmor profile that
    # permits its user namespaces. Doing it here keeps the agent properly
    # sandboxed instead of resorting to --sandbox danger-full-access.
    #
    # Every command is tolerant of failure: on a runner where this isn't
    # needed (a non-Ubuntu image, or a container without sudo) the setup is
    # skipped and the agent still runs. If the sandbox genuinely can't start,
    # apply_fix.py fails the run explicitly rather than proceeding unsandboxed.
    # Only relevant to the Codex backend. This mirrors the backend selection
    # in agent_backends.select_backend(): Codex runs when it is explicitly
    # requested, or when OPENAI_API_KEY is the only key set, or when both keys
    # are set and no preference is given. A caller on Claude Code should not
    # pay for apt-get installing bubblewrap they will never use.
    - name: Prepare Linux sandbox for the agent
      if: >-
        inputs.agent-backend == 'codex' ||
        (inputs.agent-backend == '' && inputs.openai-api-key != '')
      shell: bash
      env:
        AGENT_BACKEND: ${{ inputs.agent-backend }}
      run: |
        if [ "$RUNNER_OS" != "Linux" ]; then
          echo "[sandbox-setup] not Linux; nothing to do"
          exit 0
        fi
        if ! command -v sudo >/dev/null 2>&1; then
          echo "[sandbox-setup] no sudo available; skipping"
          exit 0
        fi

        echo "[sandbox-setup] installing bubblewrap + apparmor profiles"
        sudo apt-get update -qq || true
        sudo apt-get install -y -qq bubblewrap apparmor-profiles apparmor-utils || true

        PROFILE=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
        if [ -f "$PROFILE" ]; then
          echo "[sandbox-setup] loading bwrap-userns-restrict AppArmor profile"
          sudo install -m 0644 "$PROFILE" /etc/apparmor.d/bwrap-userns-restrict || true
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict || true
        else
          echo "[sandbox-setup] profile not present at $PROFILE"
        fi

        # Verify: this is the exact operation that fails when AppArmor blocks
        # bwrap. Its result tells us whether the sandbox will work before we
        # spend an agent run finding out.
        if command -v bwrap >/dev/null 2>&1; then
          if bwrap --unshare-all --dev-bind / / /bin/true 2>/dev/null; then
            echo "[sandbox-setup] OK — bubblewrap can create a user namespace"
          else
            echo "[sandbox-setup] WARNING: bubblewrap still cannot create a user"
            echo "[sandbox-setup] namespace. Trying the documented sysctl fallback."
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            if bwrap --unshare-all --dev-bind / / /bin/true 2>/dev/null; then
              echo "[sandbox-setup] OK after sysctl adjustment"
            else
              echo "[sandbox-setup] bubblewrap sandbox is unavailable on this runner."
              echo "[sandbox-setup] The agent step will fail rather than run unsandboxed."
            fi
          fi
        else
          echo "[sandbox-setup] bwrap not installed; the agent step will report it"
        fi

    - name: Scan + fix
      id: fix
      shell: bash
      env:
        TRIGGER_PAYLOAD: ${{ inputs.trigger-payload }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        AGENT_BACKEND: ${{ inputs.agent-backend }}
        AGENT_MODEL: ${{ inputs.agent-model }}
        AGENT_TIMEOUT_SECONDS: ${{ inputs.agent-timeout-seconds }}
        ZENIK_API_URL: ${{ inputs.zenik-api-url }}
        ZENIK_CLIENT_KEY: ${{ inputs.zenik-client-key }}
      run: python ${{ github.action_path }}/apply_fix.py
